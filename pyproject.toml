[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-evolution"
version = "7.0.14"
authors = [
    { name = "HermesAgentEvolution Team", email = "contact@example.com" },
]
description = "AI助手自我进化系统 V1/V2/V3 融合版 - 单体+微服务混合架构"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "psutil>=5.8.0",
    "pyyaml>=6.0",
    "numpy>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/WayneLiu519888/Hermes-Agent-EvolutionV3"
"Bug Reports" = "https://github.com/WayneLiu519888/Hermes-Agent-EvolutionV3/issues"
Source = "https://github.com/WayneLiu519888/Hermes-Agent-EvolutionV3"
Documentation = "https://github.com/WayneLiu519888/Hermes-Agent-EvolutionV3/wiki"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.1",
    "pytest-cov>=4.0.0",
]
full = [
    "requests>=2.25.0",
    "scikit-learn>=0.24.0",
]
# V2 微服务依赖
v2 = [
    "docker>=6.0",
    "gitpython>=3.1",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evolution = ["_plugin/*", "data/*.db", "config/*.json"]
services = ["config/*.yaml"]

[tool.setuptools.data-files]
"hermes_agent_evolution/hermes-plugin" = ["hermes-plugin/plugin.yaml", "hermes-plugin/__init__.py"]

[project.scripts]
hermes-evolution = "evolution.cli:main"